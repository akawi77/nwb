  const key = r.id + ':' + r.serial;
  if (ADM.atmUsed.some((u) => u.key === key)) return ui.alert('Already paid out', `This code for ${moneyT(r.amount)} (customer ${r.id}) was already used.`);
  ui.confirm(`${icon('check')} Valid code`, `<div class="atm-ok">${money(r.amount)}</div>Hand <b>${moneyT(r.amount)}</b> in cash to customer <b>${r.id}</b>.`, { ok: 'Mark as paid out' }).then((ok) => {
    if (!ok) return;
    ADM.atmUsed.push({ key, id: r.id, amt: r.amount, at: new Date().toISOString() }); saveAdm();
    ui.toast('Recorded as paid out'); if (nav.cur().name === 'adminAtm') nav.refresh(); else nav.replace('adminAtm');
  });
}

S.adminVoucher = {
  render: () => admHdr('Issue voucher') + scr(`<div class="form">
    ${field('Customer ID', inp('id', { mode: 'numeric', max: 6, ph: '6 digits — leave empty for anyone', v: '' }), { name: 'id', hint: 'Shown on the customer\'s home screen. Empty = any customer can redeem it once.' })}
    ${field('Amount', amountInp(), { name: 'amount' })}
    ${field('Note (for your records)', inp('note', { ph: 'e.g. Quiz winner', max: 30 }))}
    <button class="btn btn-primary btn-block" data-act="go">Create voucher</button></div>
    ${ADM.issued.length ? sec('Issued on this phone') + `<div class="list card">${ADM.issued.slice(-15).reverse().map((v) => row({ ic: 'gift', color: '#db2777', title: money(v.amt), sub: `${v.id ? 'Customer ' + v.id : 'Any customer'}${v.note ? ' · ' + esc(v.note) : ''} · ${fmtTime(v.at)}`, go: 'adminVoucherShow', p: { code: v.code } })).join('')}</div>` : ''}`, 'pad'),
  mount(el) {
    bind(el, {
      go: () => {
        const idRaw = val(el, 'id'), amt = parseAmount(val(el, 'amount'));
        if (idRaw && !/^\d{6}$/.test(idRaw)) return setErr(el, 'id', 'Customer IDs are 6 digits');
        if (!(amt > 0) || amt > 1073741823) return setErr(el, 'amount', 'Enter an amount');
        ADM.serial = ((ADM.serial || 1) % 1048575) + 1;
        const code = makeCode('VCH', +idRaw || 0, amt, ADM.serial);
        ADM.issued.push({ code, id: +idRaw || 0, amt, note: val(el, 'note'), at: new Date().toISOString() }); ADM.issued = ADM.issued.slice(-200);
        saveAdm(); nav.go('adminVoucherShow', { code });
      },
    });
  },
};
S.adminVoucherShow = {
  render: ({ code }) => {
    const v = ADM.issued.find((x) => x.code === code) || {};
    return admHdr('Voucher') + scr(`<div class="qr-card"><div class="qr-amt">${money(v.amt || 0)}</div><p class="muted small">${v.id ? 'For customer ' + v.id : 'Any customer · once per phone'}</p><div class="qr-box">${qrSvg(`NWB1|VCH|${normCode(code)}`)}</div><div class="code-pill"><small>Voucher code</small><b class="mono">${code}</b></div></div>
      <p class="muted small center">Customer: tap the scan button and scan this, or Services → Redeem voucher.</p>`, 'pad');
  },
};

// ==== 99-main.js ====
// ───────────────────────── native bridge (Android wrapper) ─────────────────────────
const native = {
  inApp: () => !!window.NWBNative,
  has: (fn) => !!(window.NWBNative && typeof window.NWBNative[fn] === 'function'),
  call: (fn, ...a) => { try { return window.NWBNative[fn](...a); } catch (e) { return null; } },
  vibrate() { if (this.has('vibrate')) this.call('vibrate', 30); else if (navigator.vibrate) navigator.vibrate(30); },
  bars(darkTop) {
    const dark = document.documentElement.dataset.theme === 'dark';
    const color = darkTop ? '#071a42' : dark ? '#070d1c' : '#f2f5fb';
    const m = $('meta[name=theme-color]'); if (m) m.content = color;
    if (this.has('setBars')) this.call('setBars', color, !darkTop && !dark);
  },
};

// called from Kotlin
window.NWB = {
  back: () => nav.back(),
  bioResult: (ok) => { if (bioResolve) { const r = bioResolve; bioResolve = null; r(!!ok); } },
  tapRequest: (cmd) => { try { return tapRequest(cmd); } catch (e) { return 'ERR|Card error'; } },
  tapResult: (resp) => tapResult(resp),
  nfcChanged: () => { const c = nav.cur(); if (c && (c.name === 'tapPay' || c.name === 'posWait')) nav.refresh(); },
};

// ───────────────────────── boot ─────────────────────────
function tick() {
  session.tick();
  if (!DB || !session.on) return;
  runOrders();
  matureDeposits(false);
  // simulated clearing: pending transfers settle after ~2 minutes
  let changed = false;
  for (const t of DB.txns) {
    if (t.status === 'pending' && Date.now() - new Date(t.date) > 120000) {
      t.status = undefined; changed = true;
      notify('Transfer completed', `${t.desc} (${moneyT(t.amt)}) has been credited to the beneficiary.`, 'check');
    }
  }
  if (changed) save();
}

// big touch screens (iPad, tablets) fill the screen; desktop browsers keep the phone frame
function fitScreen() {
  const q = new URLSearchParams(location.search);
  const fill = q.has('full') || (innerWidth >= 600 && matchMedia('(any-pointer: coarse)').matches);
  document.documentElement.classList.toggle('fill', fill);
}

function boot() {
  fitScreen();
  addEventListener('resize', fitScreen);
  loadAll();
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  document.addEventListener('click', (e) => {
    session.touch();
    const g = e.target.closest('[data-go]');
    if (g && !g.disabled) {
      e.preventDefault();
      let p = {}; try { p = g.dataset.p ? JSON.parse(g.dataset.p) : {}; } catch (er) { void er; }
      if (g.closest('.sheet-wrap')) ui.closeTop();
      return nav.go(g.dataset.go, p);
    }
    const t = e.target.closest('[data-tab]');
    if (t) { e.preventDefault(); if (t.dataset.tab === 'cards') cardIdx = cardIdx || 0; return nav.root(t.dataset.tab); }
    if (e.target.closest('[data-back]')) { e.preventDefault(); nav.back(); }
  });
  ['pointerdown', 'keydown', 'scroll'].forEach((ev) => document.addEventListener(ev, () => session.touch(), { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) session.hiddenAt = Date.now();
    else if (session.on && session.hiddenAt && Date.now() - session.hiddenAt > 60000) session.lock('Signed out for your security');
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') nav.back(); });
  window.addEventListener('beforeunload', () => { if (DB) saveNow(); });

  if (!DB) nav.root('welcome');
  else nav.root('login');
  setInterval(tick, 15000);
  setTimeout(() => { const s = $('#splash'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 500); } }, 650);
  touchIcon();
}

// home-screen icon for "Add to Home Screen" when opened as a file / in Safari
function touchIcon() {
  try {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, 180, 180); g.drawImage(img, 6, 6, 168, 168);
      const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
      const f = document.createElement('link'); f.rel = 'icon'; f.href = l.href; document.head.appendChild(f);
    };
    img.src = LOGO_SRC;
  } catch (e) { void e; }
}

boot();

})();
