<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NWB">
<meta name="description" content="New World Bank — offline mobile banking simulator">
<title>NWB · New World Bank</title>
<style>
:root {
  --bg: #f2f5fb; --surface: #ffffff; --surface2: #ebf1fa; --ink: #0b1633; --ink2: #24304d; --muted: #5b6884; --line: #dfe6f1;
  --brand: #0a6fdc; --brand2: #2f9bff; --brand-ink: #061638; --brand-soft: #e5f0ff; --gold: #fbe62e; --gold-ink: #0b1633;
  --pos: #047857; --neg: #dc2626; --warn: #b45309;
  --hero: linear-gradient(155deg, #061638 0%, #0b2a66 48%, #0a6fdc 100%);
  --shadow: 0 1px 2px rgba(11, 22, 51, .04), 0 6px 20px rgba(11, 22, 51, .06);
  --shadow-lg: 0 18px 50px rgba(11, 22, 51, .22);
  --map-bg: #e4ecf6; --map-road: #ffffff; --map-line: #c8d3e3;
  --r: 18px; --r-sm: 12px;
  --gx: 16px; --gx-narrow: 22px; /* side gutters; widened on tablets */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #070d1c; --surface: #0f182c; --surface2: #16213a; --ink: #e8eefb; --ink2: #cbd6ea; --muted: #8e9bb5; --line: #22304b;
  --brand: #5aaaff; --brand2: #8cc5ff; --brand-ink: #041233; --brand-soft: #12284d; --gold: #fbe62e;
  --pos: #34d399; --neg: #f87171; --warn: #fbbf24;
  --hero: linear-gradient(155deg, #040b1f 0%, #0a2357 50%, #0a46a8 100%);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6);
  --map-bg: #121c31; --map-road: #1f2c47; --map-line: #2c3d5e;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #d9e1ee; }
:root[data-theme="dark"] body { background: #03060d; }
body { font-family: var(--font); color: var(--ink); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
b { font-weight: 650; }
.ic { width: 22px; height: 22px; flex: none; }
.sar { height: .71em; width: auto; fill: currentColor; margin-right: .15em; vertical-align: baseline; display: inline-block; flex: none; }
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money .mask { letter-spacing: .08em; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: .02em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.pos { color: var(--pos); } .ok-t { color: var(--pos) !important; } .danger-t { color: var(--neg) !important; }
.grow { flex: 1; min-height: 16px; }

/* ── shell ── */
#app { position: relative; height: 100dvh; max-width: 440px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) { #app { height: min(100dvh - 32px, 900px); margin-top: 16px; border-radius: 34px; box-shadow: 0 30px 80px rgba(0, 0, 0, .25), 0 0 0 10px #111, 0 0 0 11px #333; } }
/* tablets (iPad, Android tablets): edge to edge, content kept at a readable width in the middle */
html.fill body { background: var(--bg); }
html.fill #app { max-width: none; height: 100dvh; margin: 0; border-radius: 0; box-shadow: none; }
html.fill { --gx: max(24px, calc((100% - 760px) / 2)); --gx-narrow: max(24px, calc((100% - 480px) / 2)); }
html.fill #tabbar { padding-left: max(4px, calc((100% - 640px) / 2)); padding-right: max(4px, calc((100% - 640px) / 2)); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scr { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.pad { padding: 8px var(--gx) 28px; } .pad-x { padding: 0 var(--gx) 28px; } .col { display: flex; flex-direction: column; }
/* scrolling columns must scroll, not squash their children */
.col > *, .form > *, .btn-col > *, .done-actions > * { flex-shrink: 0; }
.foot-space { height: 24px; }
.anim-fwd { animation: inR .28s cubic-bezier(.2, .8, .2, 1); } .anim-back { animation: inL .28s cubic-bezier(.2, .8, .2, 1); } .anim-fade { animation: fade .22s ease; }
@keyframes inR { from { transform: translateX(28%); opacity: 0; } } @keyframes inL { from { transform: translateX(-20%); opacity: 0; } } @keyframes fade { from { opacity: 0; } }

#splash { position: absolute; inset: 0; z-index: 99; background: var(--hero); display: grid; place-items: center; transition: opacity .45s; }
#splash.out { opacity: 0; pointer-events: none; }
#splash .logo { animation: pop .6s cubic-bezier(.16, 1, .3, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }

/* ── headers ── */
.hdr { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) calc(var(--gx) - 6px) 8px; min-height: 56px; background: var(--bg); position: relative; z-index: 2; flex: none; }
.hdr h1 { flex: 1; font-size: 17px; font-weight: 650; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-sp { width: 40px; flex: none; }
.hdr.on-dark { background: transparent; color: #fff; position: absolute; top: 0; left: 0; right: 0; }
.adm-hdr { background: #1c1917; color: #fde68a; }
.adm-hdr .icon-btn { color: #fde68a; }
.tab-hdr { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 18px) 0 6px; }
.tab-hdr.pad-x { padding-left: var(--gx); padding-right: var(--gx); }
.tab-hdr h1 { font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; position: relative; color: var(--ink); }
.icon-btn:active { background: var(--surface2); }
.icon-btn.on-dark { color: #fff; } .icon-btn.on-dark:active { background: rgba(255, 255, 255, .12); }
.icon-btn.ring { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .icon-btn.ring { color: var(--brand-ink); }

/* ── tab bar ── */
#tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px); position: relative; z-index: 3; }
#tabbar[hidden] { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; text-align: center; }
.tab.on { color: var(--brand); font-weight: 600; }
.tab-scan { justify-self: center; width: 58px; height: 58px; border-radius: 20px; background: var(--hero); color: #fff; display: grid; place-items: center; margin-top: -26px; box-shadow: 0 10px 24px rgba(10, 111, 220, .45), inset 0 0 0 1px rgba(255, 255, 255, .15); }
.tab-scan .ic { width: 28px; height: 28px; }
.tab-scan:active { transform: scale(.95); }

/* ── buttons & forms ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 16px; font-weight: 650; font-size: 16px; transition: transform .1s, filter .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: var(--brand-ink); }
.btn-gold { background: var(--gold); color: var(--gold-ink); }
.btn-ghost { background: var(--surface2); color: var(--ink); }
.btn-danger { background: var(--neg); color: #fff; }
.btn-block { width: 100%; display: flex; }
.btn-sm { height: 38px; font-size: 14px; padding: 0 14px; border-radius: 12px; align-self: flex-start; }
.btn-col { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.link { color: var(--brand); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
.link .ic { width: 16px; height: 16px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: flex; gap: 8px; margin-bottom: 12px; } .form-row > * { flex: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); outline: none; transition: border-color .15s; font-size: 16px; }
.input:focus { border-color: var(--brand); }
textarea.input { resize: vertical; }
.select-wrap { position: relative; }
.select-wrap select { appearance: none; padding-right: 40px; }
.select-wrap .ic { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); width: 18px; }
.hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.hint .ic { width: 15px; height: 15px; } .hint.ok { color: var(--pos); } .hint.bad { color: var(--neg); }
.hint .link { font-size: 12.5px; padding: 0; }
.err { color: var(--neg); font-size: 12.5px; min-height: 0; } .err:empty { display: none; }
.bank-detect { display: inline-flex; gap: 4px; align-items: center; } .bank-detect.ok { color: var(--pos); font-weight: 600; } .bank-detect.bad { color: var(--neg); }
.amt-inp { min-width: 0; display: flex; align-items: baseline; gap: 2px; border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 14px; background: var(--surface); font-size: 26px; font-weight: 650; line-height: 1.2; }
.amt-inp:focus-within { border-color: var(--brand); }
.amt-inp .sar { color: var(--muted); }
.amt-inp input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: none; font: inherit; font-variant-numeric: tabular-nums; padding: 0; line-height: 1.2; }
.amt-fixed { font-size: 30px; font-weight: 700; padding: 8px 0; }
.input.pick { display: flex; align-items: center; gap: 10px; text-align: left; }
.input.pick > .ic { margin-left: auto; color: var(--muted); width: 18px; }
.pick-t { display: flex; flex-direction: column; min-width: 0; } .pick-t small { color: var(--muted); font-size: 12.5px; }
.seg { display: flex; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px 6px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--muted); text-align: center; display: inline-flex; justify-content: center; align-items: center; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; flex-wrap: nowrap; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .chip.on { color: var(--brand-ink); }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch:checked { background: var(--brand); } .switch:checked::after { transform: translateX(20px); }
.slider { padding: 6px 0 10px; }
.slider-hd { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
.slider-hd span { color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--brand); height: 28px; }
.steps { display: flex; gap: 6px; margin: 4px 0 18px; } .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); } .steps i.on { background: var(--brand); }
.lead { color: var(--muted); margin-bottom: 18px; font-size: 15px; }
.ic-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.ic-pick button { width: 48px; height: 48px; border-radius: 14px; background: var(--surface2); display: grid; place-items: center; color: var(--muted); }
.ic-pick button.on { background: var(--brand); color: #fff; }

/* ── cards, lists, rows ── */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; display: block; width: 100%; }
.card.flat { background: var(--surface2); box-shadow: none; }
.list.card { padding: 4px 0; }
.list.card > .row { padding-left: 16px; padding-right: 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; text-align: left; position: relative; min-height: 60px; }
button.row:active { background: var(--surface2); }
.list > .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 64px; border-top: 1px solid var(--line); }
.list.card > .row + .row::before { right: 16px; left: 68px; }
.rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rt b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt small.wrap { white-space: normal; }
.rv { text-align: right; font-weight: 650; display: flex; flex-direction: column; align-items: flex-end; flex: none; }
.rv small { color: var(--muted); font-size: 12px; font-weight: 500; }
.chev { color: var(--muted); display: grid; } .chev .ic { width: 18px; height: 18px; }
.bub { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; color: var(--bc); background: color-mix(in srgb, var(--bc) 13%, transparent); }
.bub .ic { width: 21px; height: 21px; }
.bub.lg { width: 56px; height: 56px; border-radius: 18px; } .bub.lg .ic { width: 28px; height: 28px; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: hsl(var(--h) 55% 30%); background: hsl(var(--h) 60% 88%); }
:root[data-theme="dark"] .av { color: hsl(var(--h) 70% 82%); background: hsl(var(--h) 35% 22%); }
.av.lg { width: 68px; height: 68px; font-size: 22px; }
.av.add { background: var(--surface2); color: var(--brand); }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; font-size: 14px; align-items: baseline; }
.kv + .kv { border-top: 1px dashed var(--line); }
.kv > span { color: var(--muted); flex: none; }
.kv > b { text-align: right; font-weight: 600; word-break: break-word; }
.kv.total-row b { font-size: 18px; }
.copyable { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--brand); } .copyable .ic { width: 16px; height: 16px; }
.sec { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 8px; }
.sec h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.grp-t { font-size: 13px; font-weight: 650; margin: 14px 0 6px; color: var(--ink2); }
.day { font-size: 12.5px; font-weight: 650; color: var(--muted); padding: 14px 0 2px; }
.txns .row { min-height: 58px; }
.txns .rv .money { font-size: 15px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 34px 20px; color: var(--muted); }
.empty b { color: var(--ink); font-size: 16px; } .empty p { font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.tag .ic { width: 13px; height: 13px; }
.tag.ok { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
.tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 14px; padding: 0 12px; margin: 4px 0 10px; }
.search .ic { color: var(--muted); width: 18px; }
.search input { flex: 1; border: 0; outline: 0; background: none; height: 44px; font-size: 15px; }
.bar { height: 8px; border-radius: 8px; background: var(--surface2); overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 8px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar i.hot { background: var(--neg); }
.bar.light { background: rgba(255, 255, 255, .2); } .bar.light i { background: #fff; }
.banner-warn, .banner-info, .adm-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; font-size: 13.5px; margin: 12px 0; }
.banner-warn { background: rgba(220, 38, 38, .18); color: #fecaca; }
.banner-info { background: var(--brand-soft); color: var(--ink); } .banner-info span { flex: 1; }
.adm-banner { background: #fef3c7; color: #78350f; }
:root[data-theme="dark"] .adm-banner { background: #3a2a08; color: #fde68a; }

/* ── auth ── */
.dark-top .scr.auth-scr, .auth-scr { background: var(--hero); color: #fff; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 24px) var(--gx-narrow) calc(env(safe-area-inset-bottom) + 22px); position: relative; }
.auth-scr::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 8%, rgba(0, 133, 255, .35), transparent 45%), radial-gradient(circle at 0% 100%, rgba(251, 230, 46, .14), transparent 50%); pointer-events: none; }
.auth-scr > * { position: relative; }
.auth-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8vh 0 4vh; gap: 10px; }
.auth-hero.sm { padding: 4vh 0 2vh; gap: 4px; }
.hold-logo { border-radius: 50%; filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .35)); transition: transform .2s; user-select: none; -webkit-user-select: none; touch-action: none; }
.hold-logo.holding { transform: scale(.92); animation: hold 2s linear; }
@keyframes hold { to { filter: drop-shadow(0 0 18px rgba(251, 230, 46, .9)); } }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img.logo { display: block; border-radius: 50%; flex: none; -webkit-user-drag: none; user-select: none; }
.brand-name { font-size: 30px; font-weight: 750; letter-spacing: -.02em; }
.tagline { opacity: .75; font-size: 16px; }
.auth-feats { display: flex; flex-direction: column; gap: 10px; margin: auto 0; }
.feat { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, .08); backdrop-filter: blur(6px); font-size: 15px; }
.feat .ic { color: var(--gold); }
.auth-foot { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
.fine { font-size: 12px; opacity: .6; text-align: center; }
.login-box { margin-top: auto; display: flex; flex-direction: column; align-items: center; }
.login-box .auth-msg { color: rgba(255, 255, 255, .8); }
.login-links { display: flex; justify-content: space-between; width: 100%; max-width: 320px; margin-top: 8px; }
.login-links .link { color: var(--gold); }
.auth-msg { text-align: center; color: var(--muted); font-size: 14.5px; margin: 6px 0 4px; min-height: 20px; }
.auth-msg.err { color: #fca5a5; }
.sheet .auth-msg.err, .sheet .auth-msg { color: var(--muted); }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 14px 0 22px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: .45; transition: all .15s; }
.pin-dots i.on { background: currentColor; opacity: 1; transform: scale(1.1); }
.pin-dots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 22px; max-width: 300px; width: 100%; margin: 0 auto; }
.key { height: 64px; border-radius: 50%; font-size: 26px; font-weight: 500; display: grid; place-items: center; width: 64px; justify-self: center; transition: background .1s; }
.key:active { background: rgba(127, 127, 127, .2); }
.auth-scr .key { background: rgba(255, 255, 255, .07); }
.key.fn { background: none !important; } .key .ic { width: 28px; height: 28px; }
.pin-host { display: flex; flex-direction: column; align-items: center; width: 100%; }
.scr.pad .pin-host { color: var(--ink); }
.bio-hero { width: 96px; height: 96px; border-radius: 30px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin: 24px auto 18px; }
.bio-hero .ic { width: 48px; height: 48px; }
.bio { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0 16px; }
.bio-btn { width: 96px; height: 96px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; transition: all .25s; }
.bio-btn .ic { width: 50px; height: 50px; }

.doc-hd { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #0a6fdc; padding-bottom: 12px; margin-bottom: 12px; }
.doc-hd div { display: flex; flex-direction: column; } .doc-hd b { font-size: 16px; color: #0a6fdc; } .doc-hd small { color: #555; }
.doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; } .doc-grid div { display: flex; flex-direction: column; } .doc-grid small { color: #666; }
.doc-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #f1f5f4; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
.doc-sum div { display: flex; flex-direction: column; } .doc-sum small { color: #666; font-size: 10.5px; } .doc-sum b { font-size: 12px; } .doc .pos { color: #047857; }
.doc-t { width: 100%; border-collapse: collapse; } .doc-t th { text-align: left; font-size: 10.5px; color: #666; border-bottom: 1px solid #ddd; padding: 6px 4px; }
.doc-t td { padding: 7px 4px; border-bottom: 1px solid #eee; vertical-align: top; } .doc-t td small { display: block; color: #888; font-size: 10px; }
.doc-t td:nth-child(3), .doc-t td:nth-child(4), .doc-t th:nth-child(3), .doc-t th:nth-child(4) { text-align: right; white-space: nowrap; }
.doc-foot { margin-top: 14px; font-size: 10.5px; color: #888; text-align: center; }
.letter { font-size: 14px; line-height: 1.6; } .letter h3 { margin: 14px 0 8px; } .letter p { margin-bottom: 10px; } .letter .card { color: var(--ink); }
.stamp { width: 110px; height: 110px; border-radius: 50%; border: 3px double #0a6fdc; color: #0a6fdc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; transform: rotate(-12deg); margin: 18px 0 0 auto; opacity: .8; }
.stamp small { font-size: 9px; font-weight: 600; }

/* ── done ── */
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 40px) 0 10px; }
.done-ic { width: 84px; height: 84px; border-radius: 50%; background: var(--pos); color: #fff; display: grid; place-items: center; animation: pop .5s cubic-bezier(.16, 1, .3, 1); box-shadow: 0 0 0 12px color-mix(in srgb, var(--pos) 15%, transparent); margin-bottom: 10px; }
.done-ic .ic { width: 44px; height: 44px; stroke-width: 2.4; }
.done-ic.fail { background: var(--neg); box-shadow: 0 0 0 12px color-mix(in srgb, var(--neg) 15%, transparent); }
.done-ic.sm { width: 48px; height: 48px; margin: 0; box-shadow: none; } .done-ic.sm .ic { width: 26px; height: 26px; }
.done h2 { font-size: 22px; } .done-amt { font-size: 34px; font-weight: 750; }
.receipt { text-align: left; margin-top: 14px; }
.done-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.done-actions .btn { width: 100%; }

/* ── overlays ── */
#overlays { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#overlays > * { pointer-events: auto; }
.sheet-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: rgba(4, 10, 28, .5); opacity: 0; transition: opacity .25s; }
.sheet { width: 100%; max-width: 640px; margin: 0 auto; position: relative; background: var(--surface); border-radius: 26px 26px 0 0; max-height: 92%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .9, .3, 1); padding-bottom: env(safe-area-inset-bottom); }
.sheet-wrap.in .sheet-bg { opacity: 1; } .sheet-wrap.in .sheet { transform: none; }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; flex: none; }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 0 20px; flex: none; }
.sheet-hd h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.sheet-body { padding: 10px 20px 22px; overflow-y: auto; }
.sheet .list > .row { padding-left: 0; padding-right: 0; }
.confirm { text-align: center; padding-top: 10px; } .confirm h3 { font-size: 19px; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 6px; } .confirm p { color: var(--muted); }
.auth { display: flex; flex-direction: column; align-items: center; color: var(--ink); }
.auth-what { font-weight: 600; text-align: center; } .auth-amt { font-size: 28px; font-weight: 750; margin: 4px 0; }
.otp { display: flex; flex-direction: column; gap: 14px; text-align: center; }
.otp p { color: var(--muted); }
.otp-inp { font-size: 30px; letter-spacing: .5em; text-align: center; padding: 12px 0 12px .5em; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface2); outline: none; font-family: ui-monospace, monospace; width: 100%; }
.otp-inp:focus { border-color: var(--brand); }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; background: #0b1633; color: #fff; padding: 12px 16px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 550; transition: all .25s; max-width: 88%; box-shadow: var(--shadow-lg); z-index: 60; }
:root[data-theme="dark"] .toast { background: #e8eefb; color: #0b1633; }
.toast .ic { color: #34d399; width: 20px; } .toast.err .ic { color: #f87171; }
.toast.in { opacity: 1; transform: translate(-50%, 0); }
.push { position: absolute; left: max(10px, calc(50% - 280px)); right: max(10px, calc(50% - 280px)); top: calc(env(safe-area-inset-top) + 8px); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; text-align: left; box-shadow: var(--shadow-lg); transform: translateY(-140%); transition: transform .4s cubic-bezier(.2, .9, .3, 1.1); z-index: 70; border: 1px solid var(--line); }
.push.in { transform: none; }
.push-ic { flex: none; } .push-ic .ic { width: 28px; height: 28px; padding: 4px; border-radius: 8px; background: #22c55e; color: #fff; }
.push-t { display: flex; flex-direction: column; min-width: 0; font-size: 14px; }
.push-app { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; } .push-app i { font-style: normal; }
.push-t b:empty { display: none; }
.loading { position: absolute; inset: 0; background: rgba(4, 10, 28, .55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; z-index: 80; font-weight: 550; backdrop-filter: blur(2px); }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .25); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media print {
  body, #app { background: #fff !important; box-shadow: none !important; height: auto; max-width: none; margin: 0; }
  .hdr, #tabbar, #overlays, .form-row, .btn-col { display: none !important; }
  .scr { overflow: visible; } .doc { box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ── tap to pay & POS ── */
.tap-scr { background: var(--hero); color: #fff; display: flex; flex-direction: column; }
.tap-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: calc(env(safe-area-inset-top) + 72px) var(--gx-narrow) calc(env(safe-area-inset-bottom) + 24px); }
.tap-card { position: relative; margin: 8px 6px 10px; }
.tap-card .bank-card { position: relative; z-index: 1; }
.tap-card.armed .bank-card { animation: float 2.4s ease-in-out infinite; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
@keyframes float { 50% { transform: translateY(-8px); } }
.tap-ring { position: absolute; left: 50%; top: 50%; width: 120%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(251, 230, 46, .55); transform: translate(-50%, -50%) scale(.4); opacity: 0; animation: ring 2.2s cubic-bezier(.16, 1, .3, 1) infinite; pointer-events: none; }
.tap-ring.r2 { animation-delay: 1.1s; }
@keyframes ring { 0% { opacity: .9; transform: translate(-50%, -50%) scale(.35); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
.tap-ready { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-top: auto; }
.tap-ready .ic { width: 40px; height: 40px; color: var(--gold); }
.tap-ready b { font-size: 20px; } .tap-ready small { opacity: .75; }
.tap-note { display: flex; gap: 10px; align-items: flex-start; background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.tap-note .ic { color: var(--gold); flex: none; } .tap-note.err-n { background: rgba(220, 38, 38, .25); } .tap-note.err-n .ic { color: #fca5a5; }
.tap-scr .btn-gold { margin-top: auto; }
.tap-alt { background: rgba(255, 255, 255, .12); color: #fff; }
.tap-scr .fine { margin-top: -4px; }
.tap-chips .chip { background: rgba(255, 255, 255, .12); color: #fff; } .tap-chips .chip.on { background: var(--gold); color: var(--gold-ink); }
.tap-cta { margin-bottom: 14px; }
.pos-hd { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 16px; }
.pos-hd > .ic { color: #b45309; width: 28px; height: 28px; } .pos-hd div { flex: 1; display: flex; flex-direction: column; min-width: 0; } .pos-hd small { color: var(--muted); font-size: 12.5px; }
.pos-wait .tap-body { align-items: center; text-align: center; padding-top: calc(env(safe-area-inset-top) + 64px); }
.pos-amt { font-size: 44px; font-weight: 750; letter-spacing: -.02em; display: flex; flex-direction: column; align-items: center; }
.pos-amt small { font-size: 15px; font-weight: 500; opacity: .75; letter-spacing: 0; }
.pos-tap { position: relative; width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .08); margin: 18px 0 6px; }
.pos-tap > .ic { width: 84px; height: 84px; color: var(--gold); position: relative; z-index: 1; }
.pos-tap .tap-ring { width: 100%; }
.pos-tap.idle .tap-ring { display: none; } .pos-tap.idle > .ic { opacity: .35; }
.pos-status { font-size: 16px; min-height: 44px; } .pos-status .link { color: var(--gold); }
.pos-status .decl { color: #fca5a5; font-weight: 650; display: inline-flex; gap: 6px; align-items: center; } .pos-status .decl .ic { width: 18px; }
.pos-qr { width: 100%; margin-top: auto; background: rgba(255, 255, 255, .08); border-radius: 16px; padding: 4px 14px; text-align: left; }
.pos-qr summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; font-weight: 600; } .pos-qr summary::-webkit-details-marker { display: none; }
.pos-qr .qr-box { margin: 6px auto 10px; max-width: 220px; }
.pos-qr .btn { margin: 8px 0 12px; }

/* ── limits ── */
.limit-val { display: flex; flex-direction: column; align-items: center; padding: 6px 0 2px; }
.limit-val b { font-size: 32px; font-weight: 750; } .limit-val small { color: var(--muted); font-size: 13px; }
.limit-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -8px; }
.limit-bar { padding: 0 16px 12px 68px; } .limit-bar .bar { margin: 0; }

</style>
</head>

        return b;

      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

    };

const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

    const a = st.accounts.find((x) => x.id === acc);
    a.balance += amt;

const acct = (id) => DB.accounts.find((a) => a.id === id);
const spendable = (a) => (a.type === 'credit' ? a.limit + a.balance : a.balance);
const liquid = () => DB.accounts.filter((a) => ['current', 'savings', 'goal'].includes(a.type));
function post(accId, amt, desc, o = {}) {
  const a = acct(accId);
  a.balance += amt;
  const t = { id: uid('t'), acc: accId, amt, desc, cat: o.cat || 'other', type: o.type || 'other', date: new Date().toISOString(), ref: o.ref || refNo(), bal: a.balance, card: o.card, meta: o.meta, status: o.status };
  DB.txns.unshift(t);
  if (amt < 0 && ['local', 'intl', 'p2p'].includes(o.type)) trackOut(-amt);

}
function trackOut(amt) {
  const today = new Date().toDateString();
  if (DB.todayOut.d !== today) DB.todayOut = { d: today, amt: 0 };
  DB.todayOut.amt += amt;
}
const outToday = () => (DB.todayOut.d === new Date().toDateString() ? DB.todayOut.amt : 0);
// returns an error string, or '' when the debit may go ahead
function canDebit(accId, amt, { transfer } = {}) {
  if (DB.frozen) return 'Your accounts are restricted. Please visit an NWB branch.';
  const a = acct(accId);
  if (!a) return 'Choose an account.';
  if (!(amt > 0)) return 'Enter a valid amount.';
  if (amt > spendable(a)) return `Insufficient funds. Available: ${moneyT(spendable(a))}`;
  if (transfer && outToday() + amt > transferLimit()) return `This exceeds your daily transfer limit of ${moneyT(transferLimit())}. Remaining today: ${moneyT(Math.max(0, transferLimit() - outToday()))}`;
  return '';
}
function notify(title, body, icon = 'bell', silent = false) {

const LOGO = (s = 40) => `<img class="logo" src="${LOGO_SRC}" width="${s}" height="${s}" alt="NWB" draggable="false">`;

// ───────────────────────── navigation ─────────────────────────
const S = {}; // screen registry: { render(p) → html, mount?(el, p), tab?, title? }
const nav = {
  stack: [],
  cur() { return this.stack[this.stack.length - 1]; },
  go(name, p = {}) { this.saveScroll(); this.stack.push({ name, p }); this.render('fwd'); },
  replace(name, p = {}) { this.stack[this.stack.length - 1] = { name, p }; this.render('fade'); },
  root(name, p = {}) { this.stack = [{ name, p }]; this.render('fade'); },
  // pop until a screen with this name is on top (or to root)
  popTo(name) { while (this.stack.length > 1 && this.cur().name !== name) this.stack.pop(); this.render('back'); },
  back() {
    if (ui.closeTop()) return true;
    if (this.stack.length > 1) { this.stack.pop(); this.render('back'); return true; }
    const c = this.cur();
    if (c && S[c.name] && S[c.name].tab && c.name !== 'home') { this.root('home'); return true; }
    return false;
  },
  refresh() { this.saveScroll(); this.render('none', true); },
  saveScroll() { const b = $('#screen .scr'); if (b && this.cur()) this.cur().scroll = b.scrollTop; },
  render(anim, keepScroll) {
    if (this.cleanup) { this.cleanup(); this.cleanup = null; }
    const c = this.cur(), def = S[c.name];
    if (!def) { console.error('no screen', c.name); return; }
    // fresh element per render so listeners bound by the previous screen's mount() die with it
    const host = document.createElement('main');
    host.id = 'screen';
    $('#screen').replaceWith(host);
    host.className = 'screen' + (def.tab ? ' has-tabs' : '') + (def.dark ? ' dark-top' : '');
    host.innerHTML = def.render(c.p || {});
    if (anim !== 'none') { host.classList.add('anim-' + anim); }
    if (def.mount) def.mount(host, c.p || {});
    const body = $('.scr', host);
    if (body && (keepScroll || anim === 'back') && c.scroll) body.scrollTop = c.scroll;
    tabbar(def.tab);
    native.bars(def.dark);
  },
};

function tabbar(active) {
  const tb = $('#tabbar');
  if (!active) { tb.hidden = true; return; }
  tb.hidden = false;
  const unread = DB.notifs.filter((n) => !n.read).length;
  const T = (id, ic, label) => `<button class="tab${active === id ? ' on' : ''}" data-tab="${id}" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`;
  tb.innerHTML = T('home', 'home', 'Home') + T('pay', 'swap', 'Payments') +
    `<button class="tab-scan" data-go="scan" aria-label="Scan QR">${icon('scan')}</button>` +
    T('cards', 'card', 'Cards') + T('services', 'grid', 'Services');
  void unread;
}

// header for pushed screens
function hdr(title, o = {}) {
  return `<header class="hdr${o.cls ? ' ' + o.cls : ''}">
    ${o.noBack ? '<span class="hdr-sp"></span>' : `<button class="icon-btn" data-back aria-label="Back">${icon(o.close ? 'x' : 'chevL')}</button>`}
    <h1>${esc(title)}</h1>
    ${o.right || '<span class="hdr-sp"></span>'}
  </header>`;
}
const scr = (inner, cls = '') => `<div class="scr ${cls}">${inner}</div>`;

// delegated click actions scoped to a root element
function bind(root, map) {
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (t && root.contains(t) && map[t.dataset.act]) { e.preventDefault(); map[t.dataset.act](t, e); }
  });
}

// ───────────────────────── small building blocks ─────────────────────────
const bubble = (ic, color, cls = '') => `<span class="bub ${cls}" style="--bc:${color || 'var(--brand)'}">${icon(ic)}</span>`;
function row({ ic, color, title, sub, right, rsub, go, p, act, data = '', cls = '', chev = true, img }) {
  const attrs = go ? `data-go="${go}"${p ? ` data-p='${esc(JSON.stringify(p))}'` : ''}` : act ? `data-act="${act}"` : '';
  const tag = go || act ? 'button' : 'div';
  return `<${tag} class="row ${cls}" ${attrs} ${data}>
    ${img || (ic ? bubble(ic, color) : '')}
    <span class="rt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>
    ${right !== undefined ? `<span class="rv">${right}${rsub ? `<small>${rsub}</small>` : ''}</span>` : ''}
    ${(go || act) && chev ? `<span class="chev">${icon('chevR')}</span>` : ''}
  </${tag}>`;
}
const kv = (k, v, cls = '') => `<div class="kv ${cls}"><span>${k}</span><b>${v}</b></div>`;
const sec = (t, right = '') => `<div class="sec"><h2>${t}</h2>${right}</div>`;
const empty = (ic, t, s) => `<div class="empty">${bubble(ic, 'var(--muted)')}<b>${t}</b>${s ? `<p>${s}</p>` : ''}</div>`;
const sw = (name, on, label, sub) => `<label class="row sw-row"><span class="rt"><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" class="switch" name="${name}" ${on ? 'checked' : ''}></label>`;
function field(label, input, o = {}) {
  return `<label class="field${o.cls ? ' ' + o.cls : ''}"><span class="lbl">${label}</span>${input}${o.hint ? `<small class="hint">${o.hint}</small>` : ''}<small class="err" data-err="${o.name || ''}"></small></label>`;
}
const inp = (name, o = {}) => `<input class="input" name="${name}" ${o.type ? `type="${o.type}"` : ''} ${o.mode ? `inputmode="${o.mode}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} value="${esc(o.v ?? '')}" ${o.max ? `maxlength="${o.max}"` : ''} autocomplete="off" ${o.attrs || ''}>`;
const sel = (name, opts, v) => `<div class="select-wrap"><select class="input" name="${name}">${opts.map(([val, label]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select>${icon('chevD')}</div>`;
const amountInp = (name = 'amount', v = '') => `<div class="amt-inp">${RIYAL_SVG}<input name="${name}" inputmode="decimal" placeholder="0.00" value="${esc(v)}" autocomplete="off"></div>`;
function accOpts(filter = (a) => a.type === 'current' || a.type === 'savings') {
  return DB.accounts.filter(filter).map((a) => [a.id, `${a.name} · ${moneyT(spendable(a))}`]);
}

// PIN pad (used by login and transaction approval)
function pinPad({ len = 6, onDone, bio = false }) {
  let v = '';
  const html = `<div class="pin-dots">${'<i></i>'.repeat(len)}</div>
    <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="key" data-k="${n}">${n}</button>`).join('')}
    ${bio ? `<button class="key fn" data-k="bio" aria-label="Use fingerprint">${icon('finger')}</button>` : '<span></span>'}
    <button class="key" data-k="0">0</button><button class="key fn" data-k="del" aria-label="Delete">${icon('chevL')}</button></div>`;
  function mount(root) {
    const dots = $$('.pin-dots i', root);
    const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < v.length));
    const press = (k) => {
      if (k === 'del') v = v.slice(0, -1);
      else if (k === 'bio') return onDone(null, { bio: true, reset });
      else if (v.length < len) v += k;
      paint();
      if (v.length === len) setTimeout(() => onDone(v, { reset }), 120);
    };
    const reset = (shake) => { v = ''; paint(); if (shake) { const d = $('.pin-dots', root); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); native.vibrate(); } };
    $('.pinpad', root).addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    const kd = (e) => { if (!root.isConnected) return document.removeEventListener('keydown', kd); if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    document.addEventListener('keydown', kd);
  }
  return { html, mount };
}

function checkPin(pin) { return DB.pinHash === hashPin(pin, DB.pinSalt); }

// Approve a money movement: PIN, then (if enabled) an SMS one-time password
function authorize(summary) {
  return new Promise((resolve) => {
    let done = false;
    const pad = pinPad({
      len: 6, bio: DB.settings.bio,
      onDone: async (pin, { reset, bio }) => {
        if (bio) { const ok = await biometric('Confirm ' + summary.what); if (!ok) return; }
        else if (!checkPin(pin)) { $('.sheet .auth-msg').textContent = 'Incorrect PIN, try again'; return reset(true); }
        done = true; l.close();
        if (!ADM.otp || summary.noOtp) return resolve(true);
        resolve(await otpStep(summary));
      },
    });
    const l = ui.sheet(`<div class="auth"><p class="auth-what">${summary.what}</p>${summary.amount != null ? `<div class="auth-amt">${money(summary.amount)}</div>` : ''}<p class="auth-msg">Enter your 6-digit NWB PIN</p>${pad.html}</div>`, {
      title: 'Confirm', mount: (w) => pad.mount(w), onClose: () => { if (!done) resolve(false); },
    });
  });
}
function otpStep(summary) {
  return new Promise((resolve) => {
    const code = digits(6);
    let done = false, tries = 0;
    const send = () => setTimeout(() => ui.push('', `NWB: ${code} is your one-time password for ${summary.otpText || summary.what}${summary.amount != null ? ' of ' + moneyT(summary.amount) : ''}. Never share it with anyone, including NWB staff.`, 'chat', { sms: true, ms: 9000 }), 900);
    const l = ui.sheet(`<div class="otp"><p>We sent a 6-digit code by SMS to <b>${maskMobile()}</b></p>
      <input class="otp-inp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      <small class="err"></small>
      <button class="btn btn-primary btn-block" data-act="ok">Verify</button>
      <button class="link" data-act="resend">Didn't get it? Resend code</button></div>`, {
      title: 'Verification code',
      act: {
        ok: (b, e) => { void e; check(); },
        resend: () => { ui.toast('Code re-sent'); send(); },
      },
      mount: (w) => { const i = $('.otp-inp', w); setTimeout(() => i.focus(), 300); i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, ''); if (i.value.length === 6) check(); }); },
      onClose: () => { if (!done) resolve(false); },
    });
    function check() {
      const i = $('.otp-inp', l.el);
      if (i.value === code) { done = true; l.close(); resolve(true); return; }
      tries++;
      $('.otp .err', l.el).textContent = tries >= 3 ? 'Too many attempts. Transaction cancelled.' : 'Incorrect code';
      i.value = '';
      if (tries >= 3) setTimeout(() => l.close(), 900);
    }
    send();
  });
}

// QR image as inline SVG
function qrSvg(text, o = {}) {

// simulated fingerprint (real BiometricPrompt inside the Android app)
let bioResolve = null;
function biometric(reason) {
  if (native.has('biometric') && native.call('hasBiometric')) {
    return new Promise((res) => { bioResolve = res; native.call('biometric', reason); });
  }

function donut(parts, size = 168) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1, r = 60, C = 2 * Math.PI * r;
  let off = 0;
  const segs = parts.map((p) => { const len = (p.v / total) * C; const s = `<circle r="${r}" cx="80" cy="80" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 160 160"><circle r="${r}" cx="80" cy="80" fill="none" stroke="var(--line)" stroke-width="22"/>${segs}</svg>`;
}

// runs at boot and every minute: pays standing orders that have fallen due
function runOrders() {
  if (!DB || !DB.orders) return;
  for (const o of DB.orders.slice()) {
    let guard = 0;
    while (new Date(o.next) <= new Date() && guard++ < 12) {
      const b = DB.bens.find((x) => x.id === o.ben);
      if (!b) { DB.orders = DB.orders.filter((x) => x !== o); break; }
      if (canDebit(o.from, o.amt)) { notify('Standing order failed', `Insufficient funds for ${moneyT(o.amt)} to ${b.name}. We'll retry next time.`, 'alert'); }
      else { post(o.from, -o.amt, `Standing order · ${b.name}`, { cat: 'transfers', type: 'order' }); notify('Standing order paid', `${moneyT(o.amt)} sent to ${b.name}.`, 'repeat'); }
      o.next = (o.freq === 'weekly' ? new Date(+new Date(o.next) + 7 * DAY) : addMonths(o.next, 1)).toISOString();
      if (o.left) { o.left--; if (!o.left) { DB.orders = DB.orders.filter((x) => x !== o); break; } }
    }
  }
  save();
}

// ==== 55-p2p.js ====
// ───────────────────────── NWB Pay: offline phone-to-phone payments ─────────────────────────
// No server: the payee shows a request QR, the payer's phone debits and shows a signed receipt
// QR, the payee scans it back. Receipts are HMAC-signed with the event code and bound to the
// payee's customer ID and request nonce, so they can't be forged, redirected or claimed twice.
const myId = () => +DB.profile.cid;
const fullName = () => `${DB.profile.first} ${DB.profile.last}`;
const clean = (s) => String(s || '').replace(/\|/g, '/').slice(0, 40);
const reqCode = (id, nonce) => `${id}-${b32enc(BigInt(nonce), 4)}`;

function newNonce() {
  const used = new Set([...DB.p2p.pending.map((p) => p.nonce), ...DB.p2p.received]);
  let n; do n = rnd(1 << 20); while (used.has(n) || n === 0);
  return n;
}

function claimReceipt(code, payerName, last4) {
  const r = readCode('RCP', code, [myId()]);
  if (!r) return ui.alert('Receipt not valid', 'This receipt isn\'t valid for your account. Check that the payer scanned <b>your</b> QR and that both phones use the same event code.');
  if (DB.p2p.received.includes(r.serial)) return ui.alert('Already received', 'This payment is already in your account.');
  const req = DB.p2p.pending.find((p) => p.nonce === r.serial);
  if (!req) return ui.alert('No matching request', 'This receipt doesn\'t match an open payment request on this phone.');
  if (req.amt && req.amt !== r.amount) return ui.alert('Amount mismatch', 'The paid amount is different from what you requested.');
  const who = payerName ? clean(payerName) : `NWB customer ${r.id}`;
  DB.p2p.pending = DB.p2p.pending.filter((p) => p !== req);
  DB.p2p.received.push(r.serial);
  if (req.pos) return posApproved(r, who, req, last4);
  const t = post('cur', r.amount, `NWB Pay from ${who}`, { cat: 'transfers', type: 'in', meta: { rows: [['Payer ID', String(r.id)], ['Receipt code', r.code]] } });
  notify('Money received', `${moneyT(r.amount)} from ${who} via NWB Pay.`, 'recv', true);
  native.vibrate();
  nav.root('home');
  nav.go('done', { title: 'Money received', icon: 'recv', amount: r.amount, sub: `From ${esc(who)}`, rows: [['From', esc(who)], ['Payer ID', String(r.id)], ['To', 'Current Account'], ['Reference', t.ref]] });

function redeemVoucher(code) {
  const r = readCode('VCH', code);
  if (!r || (r.id !== 0 && r.id !== myId())) return ui.alert('Invalid voucher', 'This voucher code isn\'t valid for your account.');
  const key = r.id + ':' + r.serial;
  if (DB.p2p.vouchers.includes(key)) return ui.alert('Already redeemed', 'This voucher was already added to your account.');
  DB.p2p.vouchers.push(key);
  const t = post('cur', r.amount, 'Voucher credit · NWB', { cat: 'income', type: 'in', meta: { rows: [['Voucher', r.code]] } });
  notify('Voucher redeemed', `${moneyT(r.amount)} was added to your Current Account.`, 'gift', true);
  nav.root('home');
  nav.go('done', { title: 'Voucher redeemed', icon: 'gift', amount: r.amount, rows: [['Credited to', 'Current Account'], ['Voucher', r.code], ['Reference', t.ref]] });

// central handler for anything scanned or typed
function handleCode(text, mode) {
  const s = String(text || '').trim();
  const parts = s.split('|');
  const to = (n, p) => (nav.cur().name === 'scan' ? nav.replace(n, p) : nav.go(n, p));
  if (parts[0] === 'NWB1') {
    const [, kind, a, b, c, d] = parts;
    if (kind === 'REQ') {
      if (mode === 'receipt') return ui.alert('That\'s a payment request', 'You scanned a request QR. To complete a payment you received, scan the <b>receipt</b> the payer shows you.');
      const nonce = b32dec(b); if (nonce === null) return ui.toast('Unreadable code', 'err');
      return to('p2pPay', { to: +a, nonce: Number(nonce), amt: +c || 0, name: d || '' });
    }
    if (kind === 'RCP') return claimReceipt(a, b);
    if (kind === 'VCH') return redeemVoucher(a);
    if (kind === 'CFG') return applyCfg(a);
    if (kind === 'ATM') return adminActive() ? atmCheck(a) : ui.alert('Cash withdrawal code', 'This is a cardless withdrawal code. Show it to the NWB teller or ATM to collect cash.');
  }
  // typed codes
  const m = s.toUpperCase().replace(/\s/g, '').match(/^(\d{6})-?([0-9A-Z]{4})$/);
  if (m) { const n = b32dec(normCode(m[2])); if (n !== null) return to('p2pPay', { to: +m[1], nonce: Number(n), amt: 0, name: '' }); }
  const n = normCode(s);
  if (n.length === 20) {
    if (readCode('RCP', n, [myId()])) return claimReceipt(n);
    if (readCode('VCH', n)) return redeemVoucher(n);
    if (readCode('ATM', n)) return adminActive() ? atmCheck(n) : ui.alert('Cash withdrawal code', 'Show this code to the NWB teller to collect your cash.');
    return ui.alert('Code not recognised', 'Check the code and try again. Codes only work between phones using the same event code.');
  }
  ui.toast('Not an NWB code', 'err');
}

function manualCode(mode) {
  const hint = mode === 'receipt' ? 'The 20-character receipt code shown on the payer\'s phone' : 'A request code (e.g. 482913-7KQ2), receipt code or voucher code';
  const l = ui.sheet(`<div class="form">${field('Code', inp('code', { ph: mode === 'receipt' ? 'XXXXX-XXXXX-XXXXX-XXXXX' : 'Enter code', attrs: 'autocapitalize="characters"' }), { hint })}<button class="btn btn-primary btn-block" data-act="go">Continue</button></div>`, {

}

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }).then(async (s) => {
      if (!alive) return s.getTracks().forEach((t) => t.stop());
      stream = s; video.srcObject = s; await video.play().catch(() => {});
      el.classList.add('live');

      try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; }

            else {
              const sc = Math.min(1, 640 / video.videoWidth); cv.width = video.videoWidth * sc; cv.height = video.videoHeight * sc;
              ctx.drawImage(video, 0, 0, cv.width, cv.height);

              const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (r) text = r.data;
            }

        timer = setTimeout(loop, det ? 120 : 180);

// ==== 57-tap.js ====
// ───────────────────────── Tap to pay (NFC) & POS terminal ─────────────────────────
// In the Android app this is a real phone-to-phone tap: the customer phone emulates a card
// (Host Card Emulation) and the terminal phone reads it in NFC reader mode. One tap runs a
// two-way exchange: the terminal sends "PAY|termId|amount|nonce|merchant|note" and the card
// answers with a signed NWB Pay receipt (the same code as the QR flow), so both phones settle
// in the same tap. Browsers can't emulate a card, so there the terminal's QR is the fallback.
const TAP_SECONDS = 60;
const tap = { armed: false, until: 0, cardId: null };
const nfcState = () => (native.has('nfcState') ? native.call('nfcState') : 'unsupported'); // on | off | none | unsupported

function tapDecline(c, amt) {
  const a = acct(c.acc);
  if (DB.frozen) return 'Account restricted';
  if (c.status !== 'active') return 'Card not active';
  if (c.frozen) return 'Card is frozen';
  if (!c.limits.nfc) return 'Contactless is turned off for this card';
  if (cardSpentToday(c) + amt > c.limits.pos) return 'Daily card limit exceeded';
  if (amt > spendable(a)) return 'Insufficient funds';
  return '';
}

function disarm() { tap.armed = false; tap.until = 0; if (native.has('nfcArm')) native.call('nfcArm', false); }

// called by the native HCE service (via MainActivity) on the customer's phone
function tapRequest(cmd) {
  const [k, termIdS, amtS, n32, merchant, note] = String(cmd || '').split('|');
  if (k !== 'PAY') return 'ERR|Unknown terminal';
  if (!DB || !session.on) return 'ERR|Customer app is locked';
  const termId = +termIdS, amt = +amtS, nonce = b32dec(normCode(n32 || ''));
  if (!(amt > 0) || nonce === null) return 'ERR|Bad request from terminal';
  // a retried tap (reply lost in the air) must get the same receipt, even after disarming
  const c = DB.cards.find((x) => x.id === tap.cardId) || DB.cards[0];
  const prev = DB.p2p.sent.find((s) => s.to === termId && s.nonce === Number(nonce));
  if (prev) return `OK|${normCode(prev.code)}|${clean(fullName())}|${(DB.cards.find((x) => x.id === prev.card) || c).no.slice(-4)}`;
  if (!tap.armed || Date.now() > tap.until) return 'ERR|Card not ready. Open Tap to pay and try again';
  if (termId === myId()) return 'ERR|You can\'t pay your own terminal';
  const shop = clean(merchant) || `NWB merchant ${termId}`;
  const why = tapDecline(c, amt);
  if (why) {
    notify('Card payment declined', `${moneyT(amt)} at ${shop} was declined: ${why}.`, 'alert');
    setTimeout(() => { native.vibrate(); if (nav.cur().name === 'tapPay') nav.replace('tapPay', { card: c.id, err: why }); }, 0);
    return 'ERR|' + why;
  }
  const code = makeCode('RCP', myId(), amt, Number(nonce), [termId]);
  const t = post(c.acc, -amt, shop + (note ? ` · ${clean(note)}` : ''), { cat: 'shopping', type: 'card', card: c.id, meta: { rows: [['Channel', 'Contactless (phone tap)'], ['Terminal ID', String(termId)], ['Receipt code', code]] } });
  DB.p2p.sent.unshift({ code, to: termId, nonce: Number(nonce), name: shop, amt, date: new Date().toISOString(), ref: t.ref, card: c.id });
  save();
  disarm();
  if (DB.settings.notifTxn) notify('Contactless payment', `${moneyT(amt)} at ${shop} with card ${c.no.slice(-4)}.`, 'nfc', true);
  setTimeout(() => {
    native.vibrate();
    nav.root('cards');
    nav.go('done', { title: 'Paid', icon: 'nfc', amount: amt, sub: `at ${esc(shop)}`, rows: [['Merchant', esc(shop)], ['Card', maskCard(c.no)], ['Method', 'Contactless'], ['Reference', t.ref]], then: 'cards' });
  }, 0);
  return `OK|${normCode(code)}|${clean(fullName())}|${c.no.slice(-4)}`;
}

S.tapPay = {
  dark: true,
  render: (p) => {
    const cards = DB.cards.filter((c) => c.status === 'active');
    const c = cards.find((x) => x.id === p.card) || cards[0];
    const st = nfcState(), armed = p.armed && tap.armed;
    const top = `<header class="hdr on-dark"><button class="icon-btn on-dark" data-back aria-label="Close">${icon('x')}</button><h1>Tap to pay</h1><span class="hdr-sp"></span></header>`;
    if (!c) return `<div class="scr tap-scr">${top}<div class="tap-body">${empty('card', 'No active card')}</div></div>`;
    let body;
    if (st === 'unsupported' || st === 'none') {
      body = `<div class="tap-card">${cardVisual(c)}</div>
        <div class="tap-note">${icon('info')}<span>${st === 'none' ? 'This phone has no NFC chip.' : 'Tap to pay works in the <b>NWB Android app</b> on phones with NFC.'} You can still pay a terminal by scanning the QR on its screen.</span></div>
        <button class="btn btn-gold btn-block" data-go="scan">${icon('scan')} Scan terminal QR instead</button>`;
    } else if (st === 'off') {
      body = `<div class="tap-card">${cardVisual(c)}</div>
        <div class="tap-note">${icon('nfc')}<span>NFC is turned off. Turn it on to pay by tapping your phone.</span></div>
        <button class="btn btn-gold btn-block" data-act="nfcOn">Turn on NFC</button>
        <button class="btn btn-block tap-alt" data-go="scan">${icon('scan')} Scan terminal QR instead</button>`;
    } else if (armed) {

      document.addEventListener('visibilitychange', recheck);
      nav.cleanup = () => document.removeEventListener('visibilitychange', recheck);

function tapResult(resp) {
  if (nav.cur().name !== 'posWait') return;
  const [k, a, b, c] = String(resp || '').split('|');
  if (k === 'OK') return claimReceipt(a, b, c);

}

function posApproved(r, who, req, last4) {
  DB.posSales = DB.posSales || [];
  const t = post('cur', r.amount, `Card sale${req.note ? ' · ' + req.note : ''} · ${who}`, { cat: 'income', type: 'in', meta: { rows: [['Customer ID', String(r.id)], ['Card', last4 ? '•••• ' + last4 : 'NWB Pay QR'], ['Receipt code', r.code]] } });
  DB.posSales.unshift({ amt: r.amount, who, last4: last4 || '', note: req.note || '', date: new Date().toISOString() });

}

// deterministic fake bill for a given account number
function fakeBill(billerId, no) {
  let h = 7; for (const c of billerId + no) h = (h * 131 + c.charCodeAt(0)) >>> 0;
  if (h % 9 === 0) return 0;
  const ranges = { elec: [90, 1450], water: [40, 380], sky: [115, 460], najm: [99, 399], waves: [80, 300], fiber: [230, 430], uni: [3500, 12500], gas: [45, 160], traffic: [150, 3000], muni: [300, 2500] };
  const [lo, hi] = ranges[billerId] || [50, 500];
  return (lo + (h % (hi - lo))) * 100 + (h % 100);
}

let cardIdx = 0;

function cardVisual(c, reveal = false) {
  const kindLabel = { debit: 'DEBIT', credit: 'PLATINUM', virtual: 'VIRTUAL' }[c.kind];
  const num = reveal ? fmtCard(c.no) : '•••• •••• •••• ' + c.no.slice(-4);
  return `<div class="bank-card k-${c.kind}${c.frozen ? ' frozen' : ''}${c.status !== 'active' ? ' inactive' : ''}" data-card="${c.id}">
    <div class="bc-top"><span class="bc-brand">${LOGO(26)}<b>New World Bank</b></span><span class="bc-kind">${kindLabel}</span></div>
    <div class="bc-mid">${c.kind === 'virtual' ? icon('globe') : CHIP}${icon('nfc', 'bc-nfc')}</div>
    <div class="bc-num mono">${num}</div>
    <div class="bc-bot"><span><small>Card holder</small>${esc(fullName().toUpperCase())}</span><span><small>Expires</small>${c.exp}</span>${reveal ? `<span><small>CVV</small>${c.cvv}</span>` : ''}<span class="bc-net">${c.kind === 'credit' ? '<i></i><i></i>' : 'nwb<b>pay</b>'}</span></div>

  </div>`;
}
const cardSpentToday = (c) => DB.txns.filter((t) => t.card === c.id && t.amt < 0 && sameDay(t.date, new Date())).reduce((s, t) => s - t.amt, 0);

S.cards = {
  tab: 'cards',
  render: () => {
    const cards = DB.cards.filter((c) => c.status !== 'blocked' || DB.cards.length === 1);
    cardIdx = clamp(cardIdx, 0, cards.length - 1);
    const c = cards[cardIdx], a = acct(c.acc);
    const txns = DB.txns.filter((t) => t.card === c.id);
    const A = (ic, l, k, cls = '') => `<button class="${cls}" data-act="${k}">${bubble(ic)}<span>${l}</span></button>`;

      <div class="card-rail">${cards.map((k) => `<div class="card-slot">${cardVisual(k)}</div>`).join('')}</div>

      <div class="pad-x">

        ${c.status === 'shipping' ? `<div class="banner-info">${icon('info')}<span>Your replacement card is on its way. Activate it when it arrives.</span><button class="btn btn-sm btn-primary" data-act="activate">Activate</button></div>` : ''}

        <div class="acts four">
          ${A('eye', 'Details', 'details')}
          ${A('snow', c.frozen ? 'Unfreeze' : 'Freeze', 'freeze', c.frozen ? 'on' : '')}
          ${A('sliders', 'Controls', 'limits')}
          ${A('key', 'PIN', 'pin')}
        </div>
        <div class="list card">
          ${c.kind === 'credit' ? row({ ic: 'send', title: 'Pay credit card', sub: a.min ? `Minimum due ${moneyT(a.min)}` : 'Pay any amount', go: 'own', p: { to: 'cc' } }) : ''}
          ${row({ ic: 'cart', title: 'Simulate a purchase', sub: 'Test your card online or in store', act: 'buy' })}
          ${row({ ic: 'wallet', title: 'Add to phone wallet', sub: 'Pay with your phone', act: 'wallet' })}
          ${c.kind === 'virtual' ? row({ ic: 'trash', color: '#dc2626', title: 'Delete virtual card', act: 'delVirtual' }) : row({ ic: 'alert', color: '#dc2626', title: 'Report lost or stolen', sub: 'Block this card and order a new one', act: 'lost' })}
        </div>
        ${sec('Card transactions')}
        ${txnList(txns, 25)}
        <div class="foot-space"></div>
      </div></div>`;
  },
  mount(el) {
    const cards = DB.cards.filter((c) => c.status !== 'blocked' || DB.cards.length === 1);
    const c = cards[cardIdx];
    const rail = $('.card-rail', el);
    const step = () => { const s = $('.card-slot', el); return s ? s.offsetWidth + 12 : rail.clientWidth * 0.86; };
    requestAnimationFrame(() => { rail.scrollLeft = cardIdx * step(); });
    let st = 0;
    rail.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { const i = Math.round(rail.scrollLeft / step()); if (i !== cardIdx && cards[i]) { cardIdx = i; nav.refresh(); } }, 120); });
    $$('.bank-card', el).forEach((b, i) => b.addEventListener('click', () => { if (i !== cardIdx) { cardIdx = i; nav.refresh(); } }));
    bind(el, {
      details: async () => {
        if (!(await authorize({ what: 'Show card details', noOtp: true }))) return;
        let left = 30;
        const l = ui.sheet(`<div class="reveal">${cardVisual(c, true)}<div class="card flat">${kv('Card number', `<span class="mono">${fmtCard(c.no)}</span>`)}${kv('Expiry', c.exp)}${kv('CVV', `<span class="mono">${c.cvv}</span>`)}</div><button class="btn btn-ghost btn-block" data-act="cp">${icon('copy')} Copy card number</button><p class="muted small center">Hiding in <b class="cd">${left}</b>s</p></div>`, {
          title: 'Card details', act: { cp: () => copy(c.no, 'Card number copied') },
        });
        const t = setInterval(() => { left--; const e = $('.cd', l.el); if (e) e.textContent = left; if (left <= 0 || !l.el.isConnected) { clearInterval(t); l.close(); } }, 1000);
      },
      freeze: async () => {
        if (c.status !== 'active') return ui.toast('This card isn\'t active', 'err');
        if (!c.frozen && !(await ui.confirm('Freeze this card?', 'Purchases and withdrawals will be declined until you unfreeze it. You can unfreeze anytime.', { ok: 'Freeze card' }))) return;
        c.frozen = !c.frozen; save();
        notify(c.frozen ? 'Card frozen' : 'Card unfrozen', `${c.name} ${maskCard(c.no)} is now ${c.frozen ? 'frozen' : 'active'}.`, 'snow', true);
        ui.toast(c.frozen ? 'Card frozen' : 'Card unfrozen'); nav.refresh();
      },
      limits: () => nav.go('cardLimits', { id: c.id }),
      pin: () => {
        const l = ui.sheet(`<div class="list">${row({ ic: 'eye', title: 'View card PIN', act: 'view' })}${row({ ic: 'edit', title: 'Change card PIN', act: 'change' })}</div>`, {
          title: 'Card PIN',
          act: {
            view: async () => { l.close(); if (!(await authorize({ what: 'View card PIN', noOtp: true }))) return; ui.alert('Your card PIN', `<div class="pin-show mono">${c.pin.split('').join(' ')}</div><p class="muted small center">Don't share your PIN with anyone.</p>`); },
            change: async () => {
              l.close();
              if (!(await authorize({ what: 'Change card PIN', otpText: 'changing your card PIN' }))) return;
              let first = null;
              const pad = pinPad({ len: 4, onDone: (pin, { reset }) => {
                const m = $('.np-msg', s.el);
                if (/^(\d)\1{3}$/.test(pin)) { m.textContent = 'Too simple. Choose another PIN'; return reset(true); }
                if (!first) { first = pin; m.textContent = 'Confirm new card PIN'; return reset(); }
                if (pin !== first) { first = null; m.textContent = 'Didn\'t match. Enter new card PIN'; return reset(true); }
                c.pin = pin; save(); s.close(); notify('Card PIN changed', `The PIN for ${maskCard(c.no)} was changed.`, 'key', true); ui.toast('Card PIN changed');
              } });
              const s = ui.sheet(`<div class="auth"><p class="auth-msg np-msg">Enter new 4-digit card PIN</p>${pad.html}</div>`, { title: 'New card PIN', mount: (w) => pad.mount(w) });
            },
          },
        });
      },
      lost: async () => {
        if (!(await ui.confirm('Report card lost or stolen?', `${maskCard(c.no)} will be <b>permanently blocked</b> and a replacement card with a new number will be sent to your address.`, { ok: 'Block & replace', danger: true }))) return;
        if (!(await authorize({ what: 'Block card', noOtp: true }))) return;
        c.status = 'blocked'; c.frozen = false;
        const exp = addMonths(new Date(), 48);
        const nc = { ...c, id: uid('c'), no: luhnFill(c.no.slice(0, 6)), cvv: digits(3), exp: String(exp.getMonth() + 1).padStart(2, '0') + '/' + String(exp.getFullYear()).slice(2), status: 'shipping', limits: { ...c.limits } };
        DB.cards.splice(DB.cards.indexOf(c) + 1, 0, nc);
        DB.cards = DB.cards.filter((x) => x !== c).concat([c]);
        save();
        notify('Card blocked', `${maskCard(c.no)} is blocked. Your new card ending ${nc.no.slice(-4)} will arrive in 3–5 days.`, 'lock');
        nav.go('done', { title: 'Card blocked', icon: 'lock', sub: 'No one can use your old card. A replacement is on its way.', rows: [['Blocked card', maskCard(c.no)], ['New card', maskCard(nc.no)], ['Delivery to', esc(DB.profile.address)], ['Delivery', '3–5 business days']], then: 'cards' });
      },
      activate: () => {
        const l = ui.sheet(`<div class="form">${field('Last 4 digits of the new card', inp('l4', { mode: 'numeric', max: 4, ph: '••••' }), { name: 'l4', hint: `Hint for the event: ${c.no.slice(-4)}` })}<button class="btn btn-primary btn-block" data-act="ok">Activate card</button></div>`, {
          title: 'Activate card',
          act: { ok: () => { if (val(l.el, 'l4') !== c.no.slice(-4)) return setErr(l.el, 'l4', 'Digits don\'t match'); c.status = 'active'; save(); l.close(); ui.toast('Card activated'); nav.refresh(); } },
        });
      },
      addVirtual: async () => {
        if (DB.cards.filter((x) => x.kind === 'virtual').length >= 3) return ui.alert('Limit reached', 'You can have up to 3 virtual cards.');
        if (!(await ui.confirm('Create a virtual card?', 'A virtual card is ready instantly for safe online shopping. It\'s linked to your Current Account.', { ok: 'Create card' }))) return;
        if (!(await authorize({ what: 'Create virtual card', noOtp: true }))) return;
        const exp = addMonths(new Date(), 36);
        DB.cards.push({ id: uid('c'), kind: 'virtual', name: 'NWB Virtual', acc: 'cur', no: luhnFill('588846'), exp: String(exp.getMonth() + 1).padStart(2, '0') + '/' + String(exp.getFullYear()).slice(2), cvv: digits(3), frozen: false, status: 'active', pin: digits(4), limits: { pos: 500000, atm: 0, online: true, intl: true, nfc: false, atmOn: false } });
        cardIdx = DB.cards.length - 1; save(); ui.toast('Virtual card ready'); nav.refresh();

      wallet: async () => { const l = ui.loading('Adding card to your wallet…'); await sleep(1200); l.done(); ui.toast('Card added to phone wallet'); },
      buy: () => simulatePurchase(c),
    });
  },
};

function simulatePurchase(c) {
  const all = Object.entries(MERCHANTS).flatMap(([cat, ms]) => ms.map((m) => [cat, ...m]));
  const l = ui.sheet(`<div class="form">
    ${field('Merchant', sel('m', all.map((m, i) => [i, m[1]]), 0))}
    <span class="lbl">Channel</span>${seg('ch', [['pos', 'In store'], ['nfc', 'Tap'], ['online', 'Online'], ['intl', 'Abroad']], 'pos')}
    ${field('Amount', amountInp('amt', '120.00'), { name: 'amt' })}
    <button class="btn btn-primary btn-block" data-act="go">Pay with ${maskCard(c.no)}</button></div>`, {
    title: 'Simulate a purchase', mount: (w) => segBind(w),
    act: {
      go: async () => {
        const w = l.el, m = all[+val(w, 'm')], ch = segVal(w, 'ch'), amt = parseAmount(val(w, 'amt'));
        if (!(amt > 0)) return setErr(w, 'amt', 'Enter an amount');
        l.close();
        const ld = ui.loading('Processing payment…'); await sleep(900); ld.done();
        const a = acct(c.acc), L = c.limits;
        const why = c.status !== 'active' ? 'Card is not active' : c.frozen ? 'Card is frozen' : DB.frozen ? 'Account restricted' : ch === 'online' && !L.online ? 'Online payments are turned off' : ch === 'intl' && !L.intl ? 'International payments are turned off' : ch === 'nfc' && !L.nfc ? 'Contactless is turned off' : cardSpentToday(c) + amt > L.pos ? 'Daily card limit exceeded' : amt > spendable(a) ? 'Insufficient funds' : '';
        if (why) {
          notify('Card payment declined', `${moneyT(amt)} at ${m[1]} was declined: ${why}.`, 'alert');
          return nav.go('done', { fail: true, title: 'Payment declined', amount: amt, sub: why, then: 'cards' });
        }
        const fee = ch === 'intl' ? Math.round(amt * 0.0275) : 0;
        const t = post(c.acc, -amt, m[1] + (ch === 'intl' ? ' · Dubai, AE' : ''), { cat: m[0], type: 'card', card: c.id, meta: { rows: [['Channel', { pos: 'In store (chip & PIN)', nfc: 'Contactless', online: 'Online', intl: 'International' }[ch]]] } });
        if (fee) post(c.acc, -fee, 'International transaction fee 2.75%', { cat: 'fees', type: 'fee', card: c.id });
        if (DB.settings.notifTxn) notify('Card purchase', `${moneyT(amt)} at ${m[1]} with card ${c.no.slice(-4)}. Not you? Freeze your card in the app.`, 'card');
        nav.go('done', { title: 'Payment approved', icon: 'card', amount: amt, rows: [['Merchant', m[1]], ['Card', maskCard(c.no)], ['Auth code', digits(6)], ['Reference', t.ref]], then: 'cards' });
      },
    },
  });
}

// ───────────────────────── limits & budgets ─────────────────────────
// Customers can tune their own limits. The organizer's daily transfer limit stays the ceiling,
// so an event can still cap everyone; credit limits are capped at 5× salary (max SAR 200,000).
const transferLimit = () => Math.min(DB.settings.transferLimit || ADM.dailyLimit, ADM.dailyLimit);
const cardlessMax = () => DB.settings.cardlessMax || 500000;
const ccMax = () => Math.max(acct('cc') ? acct('cc').limit : 0, Math.min(20000000, Math.round((DB.profile.salary * 5) / 100000) * 100000));
const step1k = (h) => Math.round(h / 100000) * 100000;

// one editor for every limit: slider + exact amount, raised limits need the SMS code
function limitSheet({ title, sub, min, max, step, value, unit = 'per day', onSave }) {
  const clampV = (v) => clamp(Math.round(v / step) * step, min, max);
  const l = ui.sheet(`<div class="form limit-ed">
      ${sub ? `<p class="muted small">${sub}</p>` : ''}
      <div class="limit-val"><b data-out="v">${money(value)}</b><small>${unit}</small></div>
      <input type="range" name="r" min="${min}" max="${max}" step="${step}" value="${value}">
      <div class="limit-ends"><span>${money(min, { dp: 0 })}</span><span>${money(max, { dp: 0 })}</span></div>
      ${field('Or type an amount', amountInp('v', (value / 100).toFixed(0)), { name: 'v' })}
      <button class="btn btn-primary btn-block" data-act="save">Save</button></div>`, {
    title,
    mount: (w) => {
      const r = $('[name=r]', w), t = $('[name=v]', w), out = $('[data-out=v]', w);
      r.addEventListener('input', () => { out.innerHTML = money(+r.value); t.value = (+r.value / 100).toFixed(0); });
      t.addEventListener('input', () => { const v = parseAmount(t.value); if (v > 0) { r.value = clampV(v); out.innerHTML = money(clampV(v)); } });
    },
    act: {
      save: async () => {
        const v = parseAmount(val(l.el, 'v'));
        if (!(v > 0)) return setErr(l.el, 'v', 'Enter an amount');
        if (v < min || v > max) return setErr(l.el, 'v', `Choose between ${moneyT(min)} and ${moneyT(max)}`);
        const nv = clampV(v);
        l.close();
        if (nv === value) return;
        const up = nv > value;
        if (!(await authorize({ what: `${up ? 'Increase' : 'Lower'} ${title.toLowerCase()} to ${moneyT(nv)}`, noOtp: !up, otpText: `raising your ${title.toLowerCase()}` }))) return;
        await onSave(nv, up);
        save(); nav.refresh();
      },
    },
  });
}

function monthEnd() {
  const log = [], p = DB.profile;
  post('cur', p.salary, `Salary · ${p.employer}`, { cat: 'income', type: 'salary' });
  log.push(`Salary ${moneyT(p.salary)} credited`);
  notify('Salary credited', `Your salary of ${moneyT(p.salary)} from ${p.employer} has been credited.`, 'recv', true);
  for (const a of DB.accounts.filter((x) => x.type === 'savings' && x.balance > 0)) {
    const prof = Math.round((a.balance * a.rate) / 1200);
    if (prof > 0) { post(a.id, prof, 'Monthly profit', { cat: 'income', type: 'profit' }); log.push(`Savings profit ${moneyT(prof)}`); }
  }
  for (const ln of DB.loans.slice()) {
    if (canDebit('cur', ln.monthly)) { log.push(`Installment ${ln.contract} FAILED (insufficient funds)`); notify('Installment missed', `We couldn't collect ${moneyT(ln.monthly)} for ${ln.contract}. Please top up your account.`, 'alert', true); }
    else { payInstallment(ln); log.push(`Installment ${moneyT(ln.monthly)} collected`); }
  }
  const cc = acct('cc');
  if (cc && cc.balance < 0) {
    cc.due = -cc.balance; cc.min = Math.min(cc.due, Math.max(10000, Math.round(cc.due * 0.05))); cc.dueDate = new Date(Date.now() + 25 * DAY).toISOString();
    log.push(`Card statement ${moneyT(cc.due)}, minimum ${moneyT(cc.min)}`);
    notify('Credit card statement ready', `Statement balance ${moneyT(cc.due)}. Minimum due ${moneyT(cc.min)} by ${fmtDate(cc.dueDate)}.`, 'card', true);
  }
  save();
  return log;
}
